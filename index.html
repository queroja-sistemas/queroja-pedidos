<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faça seu pedido</title>

<style>
:root{
    --wine:#b30b2e;
    --wine-dark:#8e0623;
    --wine-soft:#d93050;
    --cream:#fff2e3;
    --cream-2:#f9e5d1;
    --cream-3:#f5d7bd;
    --brown:#4b271f;
    --text:#3a211a;
    --muted:#80675d;
    --white:#fffdfb;
    --border:#ead1be;
    --shadow:0 10px 30px rgba(80,35,20,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,253,251,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.header{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.brand{
    display:flex;
    align-items:center;
    min-width:0;
}

.brand img{
    width:155px;
    max-width:46vw;
    height:auto;
    display:block;
    object-fit:contain;
}

.cart-top{
    border:0;
    background:var(--wine);
    color:#fff;
    border-radius:999px;
    padding:13px 20px;
    font-weight:800;
    box-shadow:0 6px 16px rgba(179,11,46,.22);
    white-space:nowrap;
}

.cart-top:hover{background:var(--wine-dark)}

.hero{
    max-width:1200px;
    margin:auto;
    padding:42px 20px 18px;
}

.hero h1{
    color:var(--wine);
    font-size:clamp(30px,4vw,48px);
    line-height:1;
    margin-bottom:12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

.store-status{
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 8px;
    font-size:14px;
    font-weight:800;
}
.store-status.open{color:#167a3f}
.store-status.closed{color:var(--wine)}

.products{
    max-width:1200px;
    margin:auto;
    padding:12px 20px 70px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease;
    display:flex;
    align-items:stretch;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(80,35,20,.14);
}

.photo{
    width:120px;
    flex:0 0 120px;
    background:var(--cream-2);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-right:1px solid var(--border);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:4px;
    display:block;
}

.info{padding:14px 18px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}

.name{
    color:var(--wine);
    font-weight:900;
    font-size:19px;
    letter-spacing:.4px;
    margin-bottom:4px;
    text-align:left;
}

.desc{
    color:var(--muted);
    font-size:13px;
    line-height:1.4;
    margin-bottom:8px;
    text-align:left;
}

.price{
    color:var(--brown);
    font-size:20px;
    font-weight:900;
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:10px;
}

.qty{
    display:flex;
    align-items:center;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:11px;
    background:#fff;
}

.qty button{
    width:40px;
    height:44px;
    border:0;
    background:#fff;
    color:var(--wine);
    font-size:20px;
    font-weight:900;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:800;
}

.add{
    flex:1;
    border:0;
    border-radius:11px;
    background:var(--wine);
    color:#fff;
    font-weight:900;
}

.add:hover{background:var(--wine-dark)}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(46,15,8,.54);
    align-items:center;
    justify-content:center;
    padding:16px;
}

.overlay.active{display:flex}

.modal{
    width:100%;
    max-width:590px;
    max-height:94vh;
    overflow:auto;
    background:var(--white);
    border-radius:24px;
    border:1px solid var(--border);
    padding:25px;
    box-shadow:0 24px 70px rgba(40,15,5,.28);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.modalhead h2{
    color:var(--wine);
    font-size:28px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:var(--cream-2);
    color:var(--wine);
    font-size:24px;
    font-weight:900;
}

.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    padding:26px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:14px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
    align-items:center;
    padding:14px;
    border:1px solid var(--border);
    border-radius:14px;
    background:#fff;
}

.itemname{
    color:var(--wine);
    font-weight:900;
}

.itemprice{
    margin-top:5px;
    color:var(--muted);
    font-size:14px;
}

.controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.controls button{
    width:31px;
    height:31px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--wine);
    font-weight:900;
}

.controls .remove{
    border:0;
    background:transparent;
    color:#a33;
}

.coupon-group{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--border);
}

.coupon-row{
    display:flex;
    gap:8px;
}

.coupon-row input{
    flex:1;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
    text-transform:uppercase;
}

.coupon-apply{
    border:1px solid var(--wine);
    background:#fff;
    color:var(--wine);
    border-radius:10px;
    padding:0 16px;
    font-weight:900;
    font-size:13px;
    white-space:nowrap;
}

.coupon-feedback{
    margin-top:8px;
    font-size:12px;
    font-weight:800;
}

.coupon-feedback.success{color:#167a3f}
.coupon-feedback.error{color:#b30b2e}

.coupon-line{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
}

.coupon-line.discount{color:#167a3f}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:17px;
    border-top:2px solid var(--cream-3);
    color:var(--brown);
    font-size:22px;
    font-weight:900;
}

.form{
    margin-top:24px;
}

.form h3{
    color:var(--wine);
    margin-bottom:4px;
    font-size:21px;
}

.required-note{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.group{margin-bottom:13px}

.group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
    color:var(--text);
}

.group input,
.group textarea,
.group select{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
}

.group input:focus,
.group textarea:focus,
.group select:focus{
    outline:none;
    border-color:var(--wine);
    box-shadow:0 0 0 3px rgba(179,11,46,.08);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.finish{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:16px;
    font-weight:900;
}

.finish:hover{background:var(--wine-dark)}
.finish:disabled{opacity:.6;cursor:wait}

/* Modal de pagamento (PIX / Link de pagamento) */
.payment-box{
    background:var(--cream-2);
    border:1px dashed var(--wine);
    border-radius:14px;
    padding:16px;
    margin-top:6px;
    margin-bottom:16px;
    text-align:center;
}

.payment-box .pix-label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
    font-weight:800;
}

.payment-code{
    display:block;
    width:100%;
    word-break:break-all;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-size:13px;
    color:var(--text);
    margin-bottom:12px;
    text-align:left;
}

.payment-btn{
    display:block;
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    background:var(--wine);
    color:#fff;
    font-size:15px;
    font-weight:900;
    text-align:center;
    text-decoration:none;
    margin-bottom:10px;
}

.payment-btn:hover{background:var(--wine-dark)}

.payment-btn.secondary{
    background:#fff;
    color:var(--wine);
    border:1px solid var(--wine);
}

.copy-feedback{
    font-size:12px;
    color:#167a3f;
    font-weight:800;
    margin-top:-4px;
    margin-bottom:10px;
    min-height:16px;
}

/* Feedback visual ao adicionar produto */
@keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}

.cart-added-shake{
    animation:shake .45s ease;
}

.toast{
    position:fixed;
    left:50%;
    top:88px;
    transform:translateX(-50%) translateY(-20px);
    z-index:3000;
    background:var(--wine);
    color:#fff;
    padding:14px 22px;
    border-radius:999px;
    font-weight:900;
    box-shadow:0 12px 28px rgba(80,35,20,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:620px){
    .header{padding:10px 14px}
    .brand img{width:135px}
    .cart-top,.history-top{padding:11px 12px;font-size:12px}
    .header-actions{gap:6px}
    .hero{padding:32px 15px 14px}
    .products{padding:10px 15px 55px}
    .grid{grid-template-columns:1fr;gap:10px}
    .photo{width:88px;flex:0 0 88px}
    .photo img{padding:2px}
    .info{padding:10px 12px}
    .name{font-size:15px;margin-bottom:4px}
    .desc{font-size:11px;margin-bottom:6px}
    .price{font-size:16px;margin-bottom:8px}
    .actions{gap:6px;flex-wrap:wrap}
    .qty{justify-content:center}
    .qty button{width:34px;height:36px}
    .add{min-height:38px;font-size:12px}
    .row{grid-template-columns:1fr}
    .modal{padding:20px}
}

/* RODAPÉ FIXO */
.site-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1500;
    background:#fff;
    border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(80,35,20,.10);
    padding:10px 22px;
}
.footer-content{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}
.history-float{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    background:var(--wine);
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(80,35,20,.20);
}
.history-float:hover{background:var(--wine-dark)}
.instagram-link{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--brown);
    font-size:15px;
    font-weight:800;
    text-decoration:none;
}
.instagram-link:hover{
    color:var(--wine);
}
.instagram-icon{
    width:24px;
    height:24px;
    flex:0 0 24px;
}
body{
    padding-bottom:76px;
}

.history-result{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.history-empty,.history-loading{
    padding:16px;
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--muted);
    text-align:center;
}
.order-history-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    background:#fff;
}
.order-history-head{
    margin-bottom:10px;
}
.order-history-number{
    color:var(--wine);
    font-weight:900;
    font-size:20px;
    letter-spacing:.4px;
}
.order-history-info{
    display:grid;
    gap:5px;
    color:var(--muted);
    font-size:15px;
    line-height:1.45;
}
.order-history-total{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--cream-3);
    color:var(--brown);
    font-size:18px;
    font-weight:900;
}

@media(max-width:620px){
    .site-footer{
        padding:9px 12px;
    }
    .footer-content{
        gap:10px;
    }
    .history-float{
        padding:13px 14px;
        font-size:12px;
        white-space:nowrap;
    }
    .instagram-link{
        font-size:12px;
        gap:6px;
        white-space:nowrap;
    }
    .instagram-icon{
        width:21px;
        height:21px;
        flex-basis:21px;
    }
    body{
        padding-bottom:70px;
    }
}

/* GUARD RAILS DE SEGURANÇA */
.hp-field{
    position:absolute !important;
    left:-9999px !important;
    width:1px !important;
    height:1px !important;
    overflow:hidden !important;
    opacity:0 !important;
    pointer-events:none !important;
}
.security-note{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
    line-height:1.35;
}

</style>
</head>

<body>

<div id="cartToast" class="toast" role="status" aria-live="polite"></div>

<header>
    <div class="header">
        <a class="brand" id="brandLink" href="#" aria-label="Loja">
            <img id="brandLogo" src="images/logo-kuki-transparente.png" alt="Logo da loja">
        </a>

        <div class="header-actions">
            <button class="cart-top" type="button" onclick="openCart()">
                🛒 Finalizar pedido <span id="topCount">0</span>
            </button>
        </div>
    </div>
</header>

<section class="hero">
    <h1>Faça seu pedido</h1>
    <p>Escolha seus cookies favoritos e monte seu pedido.</p>
</section>

<div id="storeStatus" class="store-status" role="status"></div>

<main class="products">
    <div class="grid" id="products"></div>
</main>

<!-- RODAPÉ FIXO -->
<footer class="site-footer">
    <div class="footer-content">
        <a class="instagram-link"
           href="https://www.instagram.com/kukicookiees?igsi=ejd0dmI4Z2luMjI3"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram da KUKI - Kukicookiees">
            <svg class="instagram-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
            </svg>
            <span>Kukicookiees</span>
        </a>

        <button class="history-float" type="button" onclick="openHistory()">
            📋 MEUS PEDIDOS
        </button>
    </div>
</footer>

<div id="overlay" class="overlay" onclick="outside(event)">
    <div class="modal">

        <div class="modalhead">
            <h2>Meu pedido</h2>
            <button class="close" type="button" onclick="closeCart()">×</button>
        </div>

        <div id="items" class="items"></div>

        <div class="group coupon-group">
            <label for="coupon">Cupom de desconto</label>
            <div class="coupon-row">
                <input id="coupon" type="text" placeholder="Digite o código" autocomplete="off">
                <button type="button" class="coupon-apply" onclick="applyCoupon()">Aplicar</button>
            </div>
            <div id="couponFeedback" class="coupon-feedback" hidden></div>
        </div>

        <div id="subtotalLine" class="coupon-line" hidden>
            <span>Subtotal</span>
            <span id="subtotalValue">R$ 0,00</span>
        </div>
        <div id="discountLine" class="coupon-line discount" hidden>
            <span>Desconto</span>
            <span id="discountValue">- R$ 0,00</span>
        </div>

        <div class="total">
            <span>Total</span>
            <span id="total">R$ 0,00</span>
        </div>

        <div class="form">
            <h3>Seus dados</h3>
            <div class="required-note">* Campos obrigatórios</div>

            <div class="group">
                <label for="phone">WhatsApp *</label>
                <input id="phone" type="tel" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="tel">
            </div>

            <div class="group">
                <label for="name">Nome *</label>
                <div class="hp-field" aria-hidden="true">
                    <label for="website">Deixe este campo vazio</label>
                    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>
                <input id="name" type="text" placeholder="Digite seu nome" autocomplete="name">
            </div>

            <div class="group">
                <label for="payment">Forma de pagamento *</label>
                <select id="payment">
                    <option value="">Selecione</option>
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">Dinheiro</option>
                    <option value="CARTAO">Cartão</option>
                </select>
            </div>

            <div class="group">
                <label for="delivery">Tipo de entrega *</label>
                <select id="delivery">
                    <option value="">Selecione</option>
                    <option value="ENTREGA">Entrega</option>
                    <option value="RETIRADA">Retirada</option>
                </select>
            </div>

            <div class="group">
                <label for="observation">Observação/Troco</label>
                <textarea id="observation" rows="3" placeholder="Alguma observação? Ex: troco para R$ 50"></textarea>
            </div>

            <button id="finish" class="finish" type="button" onclick="finishOrder()">
                FINALIZAR PEDIDO
            </button>
        </div>
    </div>
</div>

<!-- PAGAMENTO (PIX / LINK DE PAGAMENTO) -->
<div id="paymentOverlay" class="overlay" onclick="outsidePayment(event)">
    <div class="modal">

        <div class="modalhead">
            <h2>Pedido confirmado! 🍪</h2>
            <button class="close" type="button" onclick="closePaymentModal()">×</button>
        </div>

        <div id="paymentBody"></div>

        <button class="payment-btn secondary" type="button" onclick="closePaymentModal()">
            Fechar
        </button>
    </div>
</div>

<!-- HISTÓRICO DE PEDIDOS -->
<div id="historyOverlay" class="overlay" onclick="outsideHistory(event)">
    <div class="modal">
        <div class="modalhead">
            <div>
                <h2>Meus pedidos</h2>
                <div class="required-note">Consulte seu histórico pelo WhatsApp cadastrado.</div>
            </div>
            <button class="close" type="button" onclick="closeHistory()">×</button>
        </div>

        <div class="group">
            <label for="historyPhone">WhatsApp</label>
            <input id="historyPhone" type="tel" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="tel">
        </div>

        <button id="searchHistory" class="finish" type="button" onclick="loadHistory()">CONSULTAR PEDIDOS</button>
        <div id="historyResult" class="history-result"></div>
    </div>
</div>

<script>
// HORÁRIOS DA LOJA
let storeHours = null;
let storeHoursLoaded = false;
let storeHoursLoading = false;

const DAY_TO_NAME = {
    0:"DOMINGO",
    1:"SEGUNDA",
    2:"TERÇA",
    3:"QUARTA",
    4:"QUINTA",
    5:"SEXTA",
    6:"SÁBADO"
};

function normalizeDayName(value){
    return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toUpperCase();
}

function normalizeTime(value){
    if(value === undefined || value === null) return "";
    const match = String(value).match(/^(\d{1,2}):(\d{2})/);
    if(!match) return "";
    return String(match[1]).padStart(2,"0") + ":" + match[2];
}

function getMinutes(time){
    const normalized = normalizeTime(time);
    if(!normalized) return 0;
    const [hour, minute] = normalized.split(":").map(Number);
    return hour * 60 + minute;
}

function isOpenValue(value){
    return value === true ||
        value === 1 ||
        String(value || "").trim().toUpperCase() === "TRUE";
}

function getHoursRows(data){
    if(Array.isArray(data)) return data;
    if(data && Array.isArray(data.horarios)) return data.horarios;
    if(data && Array.isArray(data.data)) return data.data;
    if(data && Array.isArray(data.body)) return data.body;
    return [];
}

function setStoreHours(data){
    const rows = getHoursRows(data);
    const map = {};

    rows.forEach(function(row){
        const dayName = normalizeDayName(
            row.DIA_SEMANA ?? row.dia_semana ?? row.dia
        );

        if(!dayName) return;

        map[dayName] = {
            aberto:isOpenValue(row.ABERTO ?? row.aberto),
            abertura:normalizeTime(row.HORA_ABERTURA ?? row.hora_abertura),
            fechamento:normalizeTime(row.HORA_FECHAMENTO ?? row.hora_fechamento)
        };
    });

    storeHours = map;
    storeHoursLoaded = Object.keys(map).length > 0;
    return storeHoursLoaded;
}

function getStoreState(){
    if(!storeHoursLoaded || !storeHours){
        return {
            open:false,
            loading:storeHoursLoading,
            message:storeHoursLoading
                ? "⏳ Consultando os horários da loja..."
                : "🔴 Não foi possível consultar os horários da loja no momento."
        };
    }

    const now = new Date();
    const dayName = normalizeDayName(DAY_TO_NAME[now.getDay()]);
    const schedule = storeHours[dayName];

    if(!schedule || !schedule.aberto){
        return {
            open:false,
            message:"🔴 Hoje " + (lojaInfo && lojaInfo.nome ? lojaInfo.nome : "a loja") + " está fechada. Voltamos em breve! 🤎"
        };
    }

    if(!schedule.abertura || !schedule.fechamento){
        return {
            open:false,
            message:"🔴 Os horários de hoje ainda não estão configurados."
        };
    }

    const current = now.getHours() * 60 + now.getMinutes();
    const opening = getMinutes(schedule.abertura);
    const closing = getMinutes(schedule.fechamento);
    const isOpen = current >= opening && current < closing;

    return {
        open:isOpen,
        message:isOpen
            ? `🟢 Estamos abertos até ${schedule.fechamento} hs`
            : `🔴 Estamos fechados no momento. Funcionamos hoje das ${schedule.abertura} hs às ${schedule.fechamento} hs.`
    };
}

function updateStoreStatus(){
    const state = getStoreState();
    const element = document.getElementById("storeStatus");

    if(!element) return state;

    element.textContent = state.message;
    element.className = "store-status " + (state.open ? "open" : "closed");

    return state;
}

function computeDiscount(subtotal, coupon){
    if(!coupon) return 0;
    let discount = 0;
    if(coupon.tipo_desconto === "PERCENTUAL"){
        discount = subtotal * (coupon.valor_desconto / 100);
    }else{
        discount = coupon.valor_desconto;
    }
    if(discount > subtotal) discount = subtotal;
    if(discount < 0) discount = 0;
    return discount;
}

    if(ids.length === 0){
        container.innerHTML =
            '<div class="empty">Seu pedido está vazio.</div>';

                        </div>

                `;
            }).join("");

    const subtotal = calculateTotal();

    const finalTotal = subtotal - discount;

    const subtotalLine = document.getElementById("subtotalLine");
    const discountLine = document.getElementById("discountLine");

    if(appliedCoupon && discount > 0){

    }else{
        subtotalLine.hidden = true;
        discountLine.hidden = true;
    }

    document.getElementById("total").textContent = money(finalTotal);
    document.getElementById("topCount").textContent = calculateCount();

    products.forEach(function(product){
        const quantityElement = document.getElementById("q" + product.id);
        if(quantityElement){
            quantityElement.textContent =
                cart[product.id] ? cart[product.id].quantity : 0;
        }
    });

            if(feedback) feedback.textContent = "Código copiado!";
            return;

            temp.value = lastPixCode;
            temp.style.position = "fixed";

            document.body.removeChild(temp);
            if(feedback) feedback.textContent = "Código copiado!";
        }catch(fallbackError){
            if(feedback) feedback.textContent = "Não foi possível copiar automaticamente. Toque no código acima e copie manualmente.";
        }
    }

// Monitoramento do status do pagamento PIX enquanto a cliente está na
// tela de pagamento, para fechar a tela automaticamente assim que o
// Mercado Pago confirmar o pagamento (via webhook -> n8n -> Supabase).
// O site não tem Supabase Realtime, então o jeito mais simples é
// perguntar de tempos em tempos ("polling") se o STATUS do pedido mudou.
let paymentPollingIntervalId = null;
let paymentPollingTimeoutId = null;

const PAYMENT_POLL_INTERVAL_MS = 4000;
const PAYMENT_POLL_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutos de segurança
const STATUS_PAGAMENTO_CONFIRMADO = "PAGAMENTO CONFIRMADO, EM PRODUÇÃO";

function stopPaymentPolling(){
    if(paymentPollingIntervalId){
        clearInterval(paymentPollingIntervalId);
        paymentPollingIntervalId = null;
    }
    if(paymentPollingTimeoutId){
        clearTimeout(paymentPollingTimeoutId);
        paymentPollingTimeoutId = null;
    }
}

function startPaymentPolling(requestId){
    stopPaymentPolling();

    if(!requestId) return;

    paymentPollingIntervalId = setInterval(async function(){
        try{
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/PEDIDOS?select=STATUS&REQUEST_ID=eq.${encodeURIComponent(requestId)}`,
                {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY
                    }
                }
            );

            if(!response.ok) return;

            const rows = await response.json();
            const status = rows && rows[0] && rows[0].STATUS;

            if(status === STATUS_PAGAMENTO_CONFIRMADO){
                showPaymentApproved();
            }
        }catch(error){
            // Falha de rede pontual não deve travar nada — a próxima
            // tentativa do intervalo consulta de novo.
            console.error("Erro ao verificar status do pagamento:", error);
        }
    }, PAYMENT_POLL_INTERVAL_MS);

    // Rede de segurança: se por algum motivo o pagamento nunca aparecer
    // como confirmado (ex: webhook do Mercado Pago falhar), para de
    // perguntar depois de um tempo em vez de ficar consultando pra sempre.
    paymentPollingTimeoutId = setTimeout(stopPaymentPolling, PAYMENT_POLL_TIMEOUT_MS);
}

function showPaymentApproved(){
    stopPaymentPolling();

    const body = document.getElementById("paymentBody");
    if(body){
        body.innerHTML = `
            <div class="payment-box" style="text-align:center">
                <div style="font-size:40px;margin-bottom:10px">✅</div>
                <p style="color:var(--muted);font-size:16px">Pagamento aprovado!<br>Seu pedido já está em produção.</p>
            </div>
        `;
    }

    setTimeout(closePaymentModal, 2500);
}

function normalizePhoneForOrder(phone){
    const digits = normalizePhone(phone);

    if(

        (digits.length === 12 || digits.length === 13)
    ){
        return digits.substring(2);
    }

    return digits;
}

    return (

    );
}

        const total = Number(order.VALOR_TOTAL ?? order.valor_total ?? order.total ?? 0);
        const number = order.NUMERO_PEDIDO || order.numero_pedido || order.ID || order.id || "Pedido";
        const date = order.DATA || order.data || order.created_at;

        return `<div class="order-history-card">
            <div class="order-history-head">
                <div class="order-history-number">${number}</div>
            </div>
            <div class="order-history-info">
                <div><strong>Data:</strong> ${formatHistoryDate(date)}</div>
            </div>
            <div class="order-history-total">Total: ${money(total)}</div>
        </div>`;
    }).join("");
}

let customerLookupTimer = null;
let lastCustomerLookupPhone = "";
let customerLookupInProgress = false;

function firstValue(obj, keys){
    if(!obj || typeof obj !== "object") return "";
    for(const key of keys){
        if(obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== ""){
            return obj[key];
        }
    }
    return "";
}

function unwrapCustomerLookup(data){
    if(Array.isArray(data)) return data[0] || null;
    if(data && Array.isArray(data.data)) return data.data[0] || data;
    if(data && Array.isArray(data.clientes)) return data.clientes[0] || data;
    if(data && data.cliente) return data;
    return data || null;
}

function fillCustomerData(data){
    const payload = unwrapCustomerLookup(data);
    if(!payload || payload.encontrado === false || payload.found === false) return false;

    const customer = payload.cliente && typeof payload.cliente === "object"
        ? payload.cliente
        : payload;

    const name = firstValue(customer, ["NOME","nome"]);
    const observation = firstValue(customer, ["OBSERVACAO_CLIENTE","OBSERVACAO","observacao"]);

    const payment =
        firstValue(payload, ["ULTIMA_FORMA_PAGAMENTO","ultima_forma_pagamento","FORMA_PAGAMENTO","forma_pagamento","PAGAMENTO","pagamento"]) ||
        firstValue(customer, ["ULTIMA_FORMA_PAGAMENTO","ultima_forma_pagamento"]);

    if(name) document.getElementById("name").value = name;
    if(observation) document.getElementById("observation").value = observation;

    if(payment){
        const paymentSelect = document.getElementById("payment");
        const normalized = String(payment).trim().toUpperCase();
        const aliases = {
            "CARTÃO":"CARTAO",
            "CARTAO":"CARTAO",
            "DINHEIRO":"DINHEIRO",
            "PIX":"PIX"
        };
        paymentSelect.value = aliases[normalized] || normalized;
    }

    return true;
}

async function lookupCustomerByPhone(){
    const phoneInput = document.getElementById("phone");
    if(!phoneInput) return;

    const rawPhone = phoneInput.value.trim();
    if(!rawPhone || !isValidPhone(rawPhone)) return;

    const phone = normalizePhoneForOrder(rawPhone);
    if(customerLookupInProgress || phone === lastCustomerLookupPhone) return;

    customerLookupInProgress = true;
    phoneInput.classList.add("customer-loading");

    try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        // Busca por telefone via função segura (RPC) em vez de ler a tabela
        // CLIENTES direto — a tabela não é mais legível publicamente, então
        // essa função retorna só nome/observação do cliente (sem endereço,
        // telefone de outras pessoas etc).
        const url = new URL(SUPABASE_URL + "/rest/v1/rpc/buscar_cliente_por_telefone");

        const response = await fetch(url.toString(),{
            method:"POST",
            signal:controller.signal,
            headers:{
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ p_telefone: phone, p_loja_id: LOJA_ID })
        });

        clearTimeout(timeout);

        if(!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const found = fillCustomerData(data);

        lastCustomerLookupPhone = phone;

        if(found){
            localStorage.setItem("kuki_whatsapp", phone);
        }
    }catch(error){
        console.warn("Não foi possível consultar o cadastro agora:", error);
    }finally{
        customerLookupInProgress = false;
        phoneInput.classList.remove("customer-loading");
    }
}

function scheduleCustomerLookup(){
    clearTimeout(customerLookupTimer);
    customerLookupTimer = setTimeout(lookupCustomerByPhone, 700);
}

const phoneInputElement = document.getElementById("phone");
if(phoneInputElement){
    phoneInputElement.addEventListener("input", function(){
        lastCustomerLookupPhone = "";
        scheduleCustomerLookup();
    });

    phoneInputElement.addEventListener("blur", lookupCustomerByPhone);
}

const SECURITY = {
    ORDER_COOLDOWN_MS: 8000,
    MAX_NAME_LENGTH: 80,
    MAX_TEXT_LENGTH: 300,
    MAX_CART_QUANTITY_PER_ITEM: 30,
    MAX_CART_ITEMS: 20,
    MAX_ORDER_TOTAL: 5000
};

let lastOrderAttemptAt = 0;

function sanitizeText(value, maxLength){
    return String(value ?? "")
        .replace(/[\u0000-\u001F\u007F]/g, " ")
        .replace(/[<>]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, maxLength);
}

function safeNumber(value, fallback = 0){
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
}

function isSafeOrder(){
    const items = Object.values(cart || {});

    if(items.length === 0 || items.length > SECURITY.MAX_CART_ITEMS){
        return {ok:false, message:"Quantidade de itens inválida."};
    }

    for(const item of items){
        const quantity = safeNumber(item.quantity);
        const price = safeNumber(item.price);

        if(!Number.isInteger(quantity) || quantity < 1 ||
           quantity > SECURITY.MAX_CART_QUANTITY_PER_ITEM){
            return {ok:false, message:"Quantidade inválida no carrinho."};
        }

        if(price < 0 || price > SECURITY.MAX_ORDER_TOTAL){
            return {ok:false, message:"Preço inválido no pedido."};
        }
    }

    const total = safeNumber(calculateTotal());
    if(total <= 0 || total > SECURITY.MAX_ORDER_TOTAL){
        return {ok:false, message:"Valor total inválido."};
    }

    return {ok:true};
}

function isBotSubmission(){
    const hp = document.getElementById("website");
    return !!(hp && hp.value.trim());
}

function makeRequestId(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }
    return "kuki-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}

function cleanCheckoutFields(){
    const fields = {
        name: ["name", SECURITY.MAX_NAME_LENGTH],
        observation: ["observation", SECURITY.MAX_TEXT_LENGTH]
    };

    const name = document.getElementById(fields.name[0]);
    if(name) name.value = sanitizeText(name.value, fields.name[1]);

    const observation = document.getElementById(fields.observation[0]);
    if(observation) observation.value = sanitizeText(observation.value, fields.observation[1]);
}

function addInputGuardRails(){
    const maxMap = {
        name: SECURITY.MAX_NAME_LENGTH,
        observation: SECURITY.MAX_TEXT_LENGTH
    };

    Object.entries(maxMap).forEach(([id, max]) => {
        const el = document.getElementById(id);
        if(el){
            el.setAttribute("maxlength", String(max));
        }
    });

    const phone = document.getElementById("phone");
    if(phone) phone.setAttribute("inputmode", "tel");
}

addInputGuardRails();

async function finishOrder(){
    cleanCheckoutFields();

    if(isBotSubmission()){
        console.warn("Envio bloqueado pelo guard rail anti-bot.");
        return;
    }

    const now = Date.now();
    if(now - lastOrderAttemptAt < SECURITY.ORDER_COOLDOWN_MS){
        alert("Aguarde alguns segundos antes de enviar novamente.");
        return;
    }

    const orderSafety = isSafeOrder();
    if(!orderSafety.ok){
        alert(orderSafety.message);
        return;
    }

    if(!LOJA_ID){
        alert("Ainda estamos carregando os dados da loja. Aguarde um instante e tente de novo.");
        return;
    }

    const storeState = getStoreState();
    if(!storeState.open){
        alert((lojaInfo && lojaInfo.nome ? lojaInfo.nome : "A loja") + " está fechada no momento. Não é possível finalizar pedidos agora.");
        return;
    }

    if(Object.keys(cart).length === 0){
        alert("Adicione pelo menos um produto ao pedido.");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const phoneInput = document.getElementById("phone").value.trim();
    const payment = document.getElementById("payment").value.trim();
    const delivery = document.getElementById("delivery").value.trim();
    const observation = document.getElementById("observation").value.trim();

    if(!phoneInput){
        alert("Digite seu WhatsApp.");
        document.getElementById("phone").focus();
        return;
    }

    if(!isValidPhone(phoneInput)){
        alert("Digite um WhatsApp válido.");
        document.getElementById("phone").focus();
        return;
    }

    if(!name){
        alert("Digite seu nome.");
        document.getElementById("name").focus();
        return;
    }

    const phone = normalizePhoneForOrder(phoneInput);

    if(!payment){
        alert("Selecione a forma de pagamento.");
        document.getElementById("payment").focus();
        return;
    }

    if(!delivery){
        alert("Selecione o tipo de entrega.");
        document.getElementById("delivery").focus();
        return;
    }

    const subtotalBeforeDiscount = calculateTotal();
    let discountApplied = 0;
    let couponCodeUsed = "";

    if(appliedCoupon){
        const button = document.getElementById("finish");
        button.disabled = true;
        button.textContent = "VALIDANDO CUPOM...";

        try{
            const redeemResponse = await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/resgatar_cupom`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({ p_codigo: appliedCoupon.codigo, p_loja_id: LOJA_ID, p_telefone: phone })
                }
            );

            const redeemData = await redeemResponse.json();
            const redeemResult = Array.isArray(redeemData) ? redeemData[0] : redeemData;

            if(!redeemResult || !redeemResult.sucesso){
                alert((redeemResult && redeemResult.mensagem) || "Não foi possível aplicar o cupom. Tente novamente.");
                clearCoupon();
                updateCart();
                button.disabled = false;
                button.textContent = "FINALIZAR PEDIDO";
                return;
            }

            discountApplied = computeDiscount(subtotalBeforeDiscount, {
                tipo_desconto: redeemResult.tipo_desconto,
                valor_desconto: Number(redeemResult.valor_desconto)
            });
            couponCodeUsed = appliedCoupon.codigo;
        }catch(error){
            alert("Não foi possível validar o cupom. Verifique sua conexão e tente novamente.");
            button.disabled = false;
            button.textContent = "FINALIZAR PEDIDO";
            return;
        }
    }

    const finalTotal = subtotalBeforeDiscount - discountApplied;

    const order = {
        request_id: makeRequestId(),
        origem: "SITE_KUKI",
        loja_id: LOJA_ID,

        cliente:{
            nome:name,
            whatsapp:phone
        },

        itens:Object.values(cart).map(function(item){
            return {
                produto_id:item.id,
                produto:item.name,
                quantidade:item.quantity,
                preco_unitario:item.price,
                valor_item:item.price * item.quantity
            };
        }),

        pagamento:payment,
        entrega:delivery,
        observacao:observation,
        total:finalTotal,
        desconto:discountApplied,
        valor_total_sem_desconto:subtotalBeforeDiscount,
        cupom_codigo:couponCodeUsed,
        data:new Date().toISOString()
    };

    const button = document.getElementById("finish");

    lastOrderAttemptAt = Date.now();
    button.disabled = true;
    button.textContent = "ENVIANDO PEDIDO...";

    const useMercadoPago = paymentNeedsMercadoPago(payment);
    const targetWebhook = useMercadoPago ? MP_WEBHOOK_URL : WEBHOOK_URL;

    console.log(
        "Enviando pedido para:", targetWebhook,
        "| forma de pagamento:", payment,
        "| usa Mercado Pago:", useMercadoPago
    );

    try{
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        // Envios como application/json garantem o parse estruturado no n8n
        const response = await fetch(
            targetWebhook,
            {
                method:"POST",
                signal:controller.signal,
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(order)
            }
        );

        clearTimeout(timeout);

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const responseData = await response.json();
        localStorage.setItem("kuki_whatsapp", phone);

        // Log de depuração: abra o console do navegador (ou o modo de
        // depuração remota no celular) para ver exatamente o que o n8n
        // devolveu em cada forma de pagamento.
        console.log("Resposta do n8n:", responseData);

        // O pedido já foi enviado com sucesso a partir daqui — o que
        // acontece abaixo é só a EXIBIÇÃO do PIX/link, então isso fica
        // fora do try/catch de rede para não gerar um alerta de "erro
        // de conexão" falso caso algo falhe só na exibição.
        cart = {};
        updateCart();
        closeCart();

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("payment").value = "";
        document.getElementById("delivery").value = "";
        document.getElementById("observation").value = "";
        clearCoupon();

        // Processa o retorno do PIX ou Link de Pagamento do n8n.
        // Alguns nodes "Respond to Webhook" do n8n devolvem os dados
        // dentro de uma lista (ex: [{ ... }]) em vez de um objeto
        // direto — este trecho cobre os dois formatos.
        const paymentData = Array.isArray(responseData) ? (responseData[0] || {}) : responseData;

        // "init_point" (ou "sandbox_init_point" em ambiente de teste)
        // é o campo padrão da API do Mercado Pago para o link de
        // checkout (Preference).
        const paymentUrl =
            paymentData.init_point ||
            paymentData.sandbox_init_point ||
            paymentData.payment_url ||
            paymentData.pix_url ||
            paymentData.link_pagamento;

        // No pagamento via PIX, a API do Mercado Pago normalmente
        // devolve o código "copia e cola" dentro de
        // point_of_interaction.transaction_data.qr_code, e a imagem
        // do QR Code (em base64) em .qr_code_base64.
        const transactionData =
            (paymentData.point_of_interaction && paymentData.point_of_interaction.transaction_data) || {};

        const pixCode =
            paymentData.pix_copia_cola ||
            paymentData.pix_code ||
            paymentData.pix ||
            transactionData.qr_code;

        const pixQrImage = transactionData.qr_code_base64
            ? ("data:image/png;base64," + transactionData.qr_code_base64)
            : null;

        showPaymentResult(pixCode, paymentUrl, name, pixQrImage, order.request_id);

    }catch(error){
        console.error("Erro ao enviar pedido:",error);

        alert(
            "Não foi possível enviar o pedido.\n\n" +
            "Verifique sua conexão e tente novamente."
        );
    }finally{
        button.disabled = false;
        button.textContent = "FINALIZAR PEDIDO";
    }
}

// Renderização inicial e sincronização com o Supabase.
renderProducts();
updateCart();
updateStoreStatus();
loadStoreData();
setInterval(updateStoreStatus, 60000);
setInterval(loadStoreData, 5 * 60 * 1000);
</script>
